name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24.11.0

      - name: install dependecies
        run: npm run install

      - name: run unit tests
        run: npm run test
