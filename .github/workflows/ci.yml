name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Force Failure
        run: node --version
