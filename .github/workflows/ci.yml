name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24.11.0
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: build
        run: npm run build

      - name: run unit tests
        run: npm run test

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24.11.0
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: lint check
        run: npm run format:check
